<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Módulos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#13292B;
    --tinta-fraca:#5A6E6F;
    --papel:#E7ECE6;
    --cartao:#F8FAF6;
    --linha:rgba(19,41,43,.16);
    --foco:#0F6FA8;
    --raio:4px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--papel);
    color:var(--tinta);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    font-size:16px;
    line-height:1.5;
    display:flex;
    flex-direction:column;
  }
  /* linha milimetrada discreta, como papel de receituário */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--linha) 1px,transparent 1px);
    background-size:100% 28px;opacity:.35;
  }
  .topo,.principal,.visor{position:relative;z-index:1}

  /* ---------- cabeçalho ---------- */
  .topo{
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    padding:22px 24px 18px;border-bottom:1px solid var(--linha);
    background:rgba(231,236,230,.9);backdrop-filter:blur(4px);
  }
  .marca{
    font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;
    font-size:clamp(22px,3.4vw,30px);letter-spacing:.14em;text-transform:uppercase;margin:0;
  }
  .marca span{color:var(--tinta-fraca)}
  .topo p{
    margin:0;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-fraca);
  }

  /* ---------- grade de módulos ---------- */
  .principal{flex:1;padding:32px 24px 48px;max-width:1080px;width:100%;margin:0 auto}
  .grade{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

  .cartao{
    display:flex;flex-direction:column;text-align:left;
    background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);
    padding:0;overflow:hidden;cursor:pointer;font:inherit;color:inherit;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .cartao:hover{transform:translateY(-3px);box-shadow:0 10px 22px -14px rgba(19,41,43,.55)}
  .cartao:focus-visible{outline:3px solid var(--foco);outline-offset:2px}

  /* tarja: a faixa das caixas de medicamento — assinatura do painel */
  .tarja{
    background:var(--cor);color:#fff;padding:7px 14px;
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;
    display:flex;justify-content:space-between;gap:12px;
  }
  .corpo{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
  .corpo h2{
    font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;
    font-size:25px;letter-spacing:.02em;margin:0;
  }
  .corpo p{margin:0;color:var(--tinta-fraca);font-size:14.5px}
  .meta{
    margin-top:auto;padding-top:14px;border-top:1px dashed var(--linha);
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--tinta-fraca);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .meta a{color:var(--cor);text-decoration:none;border-bottom:1px solid transparent}
  .meta a:hover{border-bottom-color:var(--cor)}
  .meta a:focus-visible{outline:2px solid var(--foco);outline-offset:2px}

  .rodape{
    margin-top:34px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
    color:var(--tinta-fraca);letter-spacing:.04em;max-width:60ch;
  }

  /* ---------- visor com o módulo aberto ---------- */
  .visor{display:none;flex:1;flex-direction:column;background:var(--cartao)}
  .visor.ativo{display:flex}
  body.vendo .principal,body.vendo .topo{display:none}

  .barra{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:8px 12px;border-bottom:1px solid var(--linha);background:var(--papel);
  }
  .barra button,.barra a{
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;
    letter-spacing:.08em;text-transform:uppercase;
    padding:8px 12px;border-radius:var(--raio);border:1px solid transparent;
    background:none;color:var(--tinta-fraca);cursor:pointer;text-decoration:none;
  }
  .barra button:hover,.barra a:hover{background:rgba(19,41,43,.07);color:var(--tinta)}
  .barra button:focus-visible,.barra a:focus-visible{outline:3px solid var(--foco);outline-offset:1px}
  .barra .aba[aria-selected="true"]{
    background:#fff;color:var(--tinta);border-color:var(--linha);
    box-shadow:inset 0 -3px 0 var(--cor-aba);
  }
  .barra .direita{margin-left:auto;display:flex;gap:4px}
  .voltar{border-color:var(--linha)!important}

  iframe{flex:1;width:100%;border:0;background:#fff;min-height:0}

  @media (max-width:560px){
    .principal{padding:22px 16px 36px}
    .topo{padding:16px}
    .barra .direita{margin-left:0;width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    .cartao{transition:none}
    .cartao:hover{transform:none}
  }
</style>
</head>
<body>

<header class="topo">
  <h1 class="marca">Painel <span>/ módulos</span></h1>
  <p id="contagem"></p>
</header>

<main class="principal">
  <div class="grade" id="grade"></div>
  <p class="rodape">
    Cada módulo abre aqui dentro, em tela cheia, e a barra de cima troca de um para o outro.
    Para acrescentar um módulo novo, edite a lista MODULOS no fim deste arquivo.
  </p>
</main>

<section class="visor" id="visor" aria-live="polite">
  <div class="barra" id="barra"></div>
  <iframe id="quadro" title="Módulo aberto" allow="clipboard-write; fullscreen"></iframe>
</section>

<script>
/* ====================================================================
   LISTA DE MÓDULOS — para incluir outro repositório, copie um bloco
   e troque os campos. Nada mais precisa ser mexido.
   ==================================================================== */
const MODULOS = [
  {
    id: "receitas",
    nome: "Receitas",
    faixa: "Receituário",
    resumo: "Emissão, edição e impressão de receitas, com listas de médicos, medicamentos e clientes.",
    site: "https://jeffersontete-ui.github.io/RECEITAS/",
    repo: "https://github.com/jeffersontete-ui/RECEITAS",
    cor: "#1B6E52"
  },
  {
    id: "cotacao",
    nome: "Cotação",
    faixa: "Compras",
    resumo: "Cotação de medicamentos por fornecedor, com preços preenchidos on-line e comparação.",
    site: "https://jeffersontete-ui.github.io/cotacao/",
    repo: "https://github.com/jeffersontete-ui/cotacao",
    cor: "#B0691A"
  }
];

const grade = document.getElementById("grade");
const barra = document.getElementById("barra");
const visor = document.getElementById("visor");
const quadro = document.getElementById("quadro");

document.getElementById("contagem").textContent =
  MODULOS.length + (MODULOS.length === 1 ? " módulo" : " módulos") + " disponíveis";

/* ---- cartões da tela inicial ---- */
MODULOS.forEach(m => {
  const cartao = document.createElement("button");
  cartao.className = "cartao";
  cartao.style.setProperty("--cor", m.cor);
  cartao.innerHTML = `
    <div class="tarja"><span>${m.faixa}</span><span>uso interno</span></div>
    <div class="corpo">
      <h2>${m.nome}</h2>
      <p>${m.resumo}</p>
      <div class="meta">
        <span>abrir no painel</span>
        <a href="${m.repo}" target="_blank" rel="noopener">repositório ↗</a>
      </div>
    </div>`;
  cartao.addEventListener("click", e => {
    if (e.target.closest("a")) return;   // o link do repositório segue seu caminho
    abrir(m.id);
  });
  grade.appendChild(cartao);
});

/* ---- barra de abas do visor ---- */
const voltar = document.createElement("button");
voltar.className = "voltar";
voltar.textContent = "← Painel";
voltar.addEventListener("click", fechar);
barra.appendChild(voltar);

MODULOS.forEach(m => {
  const aba = document.createElement("button");
  aba.className = "aba";
  aba.textContent = m.nome;
  aba.dataset.id = m.id;
  aba.setAttribute("role", "tab");
  aba.setAttribute("aria-selected", "false");
  aba.style.setProperty("--cor-aba", m.cor);
  aba.addEventListener("click", () => abrir(m.id));
  barra.appendChild(aba);
});

const direita = document.createElement("div");
direita.className = "direita";
const novaAba = document.createElement("a");
novaAba.target = "_blank"; novaAba.rel = "noopener"; novaAba.textContent = "Nova aba ↗";
const linkRepo = document.createElement("a");
linkRepo.target = "_blank"; linkRepo.rel = "noopener"; linkRepo.textContent = "Repositório ↗";
direita.append(novaAba, linkRepo);
barra.appendChild(direita);

/* ---- abrir e fechar ---- */
function abrir(id){
  const m = MODULOS.find(x => x.id === id);
  if (!m) return;
  quadro.src = m.site;
  quadro.title = "Módulo " + m.nome;
  novaAba.href = m.site;
  linkRepo.href = m.repo;
  barra.querySelectorAll(".aba").forEach(a =>
    a.setAttribute("aria-selected", String(a.dataset.id === id)));
  document.body.classList.add("vendo");
  visor.classList.add("ativo");
  history.replaceState(null, "", "#" + id);
  document.title = m.nome + " — Painel";
}

function fechar(){
  document.body.classList.remove("vendo");
  visor.classList.remove("ativo");
  quadro.removeAttribute("src");
  history.replaceState(null, "", location.pathname);
  document.title = "Painel — Módulos";
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.body.classList.contains("vendo")) fechar();
});

/* abre direto se a página foi chamada com #receitas ou #cotacao */
const inicial = location.hash.replace("#", "");
if (inicial) abrir(inicial);
</script>
</body>
</html>
